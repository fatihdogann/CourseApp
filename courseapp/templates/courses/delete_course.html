{% extends 'base.html' %}
{% load static %}

{% block title %}Kurs Sil{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Kurs Silme Onayı</h3>
                </div>
                <div class="card-body p-4">
                    <h4 class="mb-3">"{{ course.name }}" kursunu silmek istediğinizden emin misiniz?</h4>
                    <p class="text-danger mb-4">Bu işlem geri alınamaz!</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex">
                            <button type="submit" class="btn btn-danger">Evet, Sil</button>
                            <a href="{% url 'course_detail' course.category.slug course.slug %}" class="btn btn-outline-secondary ms-2">İptal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
